name: Build Electron App

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: electron-release-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: QuantumNous/new-api

jobs:
  sync:
    name: Sync latest upstream release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      has_release: ${{ steps.release.outputs.has_release }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Check out fork main branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0

      - name: Select latest upstream release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          latest_tag="$(
            gh api --paginate --slurp \
              "repos/${UPSTREAM_REPOSITORY}/releases?per_page=100" \
              | jq -r 'add
                | [.[] | select(.draft == false)]
                | sort_by(.published_at // .created_at)
                | last
                | .tag_name // ""'
          )"

          if [[ -z "$latest_tag" ]]; then
            echo '::error::The upstream repository has no published releases.'
            exit 1
          fi

          fork_release_tags="$(
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              | jq -c 'add | [.[] | select(.draft == false) | .tag_name]'
          )"

          echo "Latest upstream release: $latest_tag"
          echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"

          if jq -e --arg tag "$latest_tag" \
            'any(.[]; . == $tag)' <<< "$fork_release_tags" >/dev/null; then
            echo "Release '$latest_tag' is already published in the fork."
            echo 'has_release=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'has_release=true' >> "$GITHUB_OUTPUT"

      - name: Merge upstream release commits
        if: steps.release.outputs.has_release == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"

          upstream_ref="refs/remotes/upstream/releases/$RELEASE_TAG"
          git fetch --no-tags upstream "refs/tags/$RELEASE_TAG:$upstream_ref"
          upstream_commit="$(git rev-parse "$upstream_ref^{commit}")"

          if git merge-base --is-ancestor "$upstream_commit" HEAD; then
            echo "Fork main already contains all commits through '$RELEASE_TAG'."
          else
            fork_head="$(git rev-parse HEAD)"
            merge_status=0
            git merge --no-ff --no-commit "$upstream_commit" || merge_status=$?

            git restore \
              --source="$fork_head" \
              --staged \
              --worktree \
              -- .github/workflows
            git add -A -- .github/workflows

            conflicted_files="$(git diff --name-only --diff-filter=U)"
            if [[ -n "$conflicted_files" ]]; then
              echo '::error::Upstream release has merge conflicts outside .github/workflows:'
              printf '%s\n' "$conflicted_files"
              git merge --abort
              exit 1
            fi

            if [[ "$merge_status" -ne 0 && ! -f .git/MERGE_HEAD ]]; then
              echo '::error::Unable to start the upstream release merge.'
              exit "$merge_status"
            fi

            git commit -m "chore: merge upstream release $RELEASE_TAG"
            git push origin HEAD:main
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag '$RELEASE_TAG' already exists in the fork; keeping it for the build."
          else
            git tag "$RELEASE_TAG" HEAD
            git push origin "refs/tags/$RELEASE_TAG"
          fi

  build:
    name: Build Windows Electron release (${{ needs.sync.outputs.tag }})
    needs: sync
    if: needs.sync.outputs.has_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.sync.outputs.tag }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build frontend
        env:
          CI: ''
          NODE_OPTIONS: '--max-old-space-size=4096'
          VITE_REACT_APP_VERSION: ${{ needs.sync.outputs.tag }}
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' bun run build

      - name: Build Windows backend
        env:
          RELEASE_TAG: ${{ needs.sync.outputs.tag }}
        run: |
          go mod download
          go build \
            -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$RELEASE_TAG'" \
            -o new-api.exe

      - name: Install Electron dependencies
        run: npm ci
        working-directory: electron

      - name: Set Electron version
        env:
          RELEASE_TAG: ${{ needs.sync.outputs.tag }}
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version
        working-directory: electron

      - name: Build Windows Electron app
        run: npm run build:win
        working-directory: electron

      - name: Read upstream release metadata
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.sync.outputs.tag }}
        run: |
          set -euo pipefail

          release_json="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/tags/$RELEASE_TAG")"
          jq -r '.body // ""' <<< "$release_json" > release-notes.md
          echo "prerelease=$(jq -r '.prerelease' <<< "$release_json")" >> "$GITHUB_OUTPUT"

      - name: Publish Electron release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ needs.sync.outputs.tag }}
          name: ${{ needs.sync.outputs.tag }}
          body_path: release-notes.md
          prerelease: ${{ steps.release.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: electron/dist/*.exe
