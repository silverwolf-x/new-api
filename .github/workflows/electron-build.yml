name: Build Electron App

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Upstream release tag to build; leave empty to sync automatically'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: electron-release-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: QuantumNous/new-api

jobs:
  sync:
    name: Sync upstream main and release tags
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      has_releases: ${{ steps.releases.outputs.has_releases }}
      tags: ${{ steps.releases.outputs.tags }}

    steps:
      - name: Check out fork main branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0

      - name: Sync upstream main branch
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream main

          fork_head="$(git rev-parse HEAD)"
          upstream_head="$(git rev-parse upstream/main)"
          git read-tree --reset -u "$upstream_head"
          git checkout "$fork_head" -- .github/workflows
          git add -A

          if git diff --cached --quiet; then
            echo 'Fork main is already up to date.'
            exit 0
          fi

          git commit -m "chore: sync upstream main at $upstream_head"
          git push origin HEAD:main

      - name: Select upstream releases to publish
        id: releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail

          upstream_tags="$(
            gh api --paginate --slurp \
              "repos/${UPSTREAM_REPOSITORY}/releases?per_page=100" \
              | jq -c 'add | [.[] | select(.draft == false) | .tag_name]'
          )"
          requested_tag="$REQUESTED_TAG"

          if [[ -n "$requested_tag" ]]; then
            if ! jq -e --arg tag "$requested_tag" \
              'any(.[]; . == $tag)' <<< "$upstream_tags" >/dev/null; then
              echo "::error::Tag '$requested_tag' is not a published upstream release."
              exit 1
            fi
            selected_tags="$(jq -cn --arg tag "$requested_tag" '[$tag]')"
          else
            fork_release_tags="$(
              gh api --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                | jq -c 'add | [.[] | select(.draft == false) | .tag_name]'
            )"
            fork_synced_tags="$(
              git ls-remote --tags --refs origin \
                | cut -f2- \
                | sed 's#^refs/tags/##' \
                | jq -Rsc 'split("\n") | map(select(length > 0))'
            )"

            if [[ "$(jq 'length' <<< "$upstream_tags")" -eq 0 ]]; then
              echo '::error::The upstream repository has no published releases.'
              exit 1
            fi

            anchor_index="$(
              jq -rn \
                --argjson upstream "$upstream_tags" \
                --argjson synced "$fork_synced_tags" \
                '[range(0; $upstream | length) as $index
                  | select($upstream[$index] as $tag | any($synced[]; . == $tag))
                  | $index]
                 | if length == 0 then -1 else max end'
            )"

            if [[ "$anchor_index" -eq -1 ]]; then
              selected_tags="$(jq -c '.[0:1]' <<< "$upstream_tags")"
            else
              selected_tags="$(
                jq -cn \
                  --argjson upstream "$upstream_tags" \
                  --argjson released "$fork_release_tags" \
                  --argjson anchor "$anchor_index" \
                  '[$upstream[0:$anchor + 1][]
                    | select(. as $tag | all($released[]; . != $tag))]
                   | reverse'
              )"
            fi
          fi

          if [[ "$(jq 'length' <<< "$selected_tags")" -eq 0 ]]; then
            echo 'No unpublished upstream releases were found.'
            echo 'has_releases=false' >> "$GITHUB_OUTPUT"
            echo 'tags=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Selected release tags: $(jq -r 'join(", ")' <<< "$selected_tags")"
          echo 'has_releases=true' >> "$GITHUB_OUTPUT"
          echo "tags=$selected_tags" >> "$GITHUB_OUTPUT"

      - name: Sync selected upstream tags
        if: steps.releases.outputs.has_releases == 'true'
        env:
          RELEASE_TAGS: ${{ steps.releases.outputs.tags }}
        run: |
          set -euo pipefail

          fork_head="$(git rev-parse HEAD)"
          while IFS= read -r tag; do
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "Tag '$tag' already exists in the fork; keeping it for the build."
              continue
            fi

            upstream_ref="refs/upstream/releases/$tag"
            git fetch --no-tags upstream "refs/tags/$tag:$upstream_ref"
            upstream_commit="$(git rev-parse "$upstream_ref^{commit}")"

            git read-tree --reset -u "$upstream_commit"
            git checkout "$fork_head" -- .github/workflows
            git add -A
            git commit --allow-empty -m "chore: sync upstream release $tag"
            git tag "$tag" HEAD
            git push origin "refs/tags/$tag"
            git reset --hard "$fork_head"
          done < <(jq -r '.[]' <<< "$RELEASE_TAGS")

  build:
    name: Build Windows Electron release (${{ matrix.tag }})
    needs: sync
    if: needs.sync.outputs.has_releases == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        tag: ${{ fromJSON(needs.sync.outputs.tags) }}
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ matrix.tag }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build frontend
        env:
          CI: ''
          NODE_OPTIONS: '--max-old-space-size=4096'
          VITE_REACT_APP_VERSION: ${{ matrix.tag }}
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' bun run build

      - name: Build Windows backend
        env:
          RELEASE_TAG: ${{ matrix.tag }}
        run: |
          go mod download
          go build \
            -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$RELEASE_TAG'" \
            -o new-api.exe

      - name: Install Electron dependencies
        run: npm ci
        working-directory: electron

      - name: Set Electron version
        env:
          RELEASE_TAG: ${{ matrix.tag }}
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version
        working-directory: electron

      - name: Build Windows Electron app
        run: npm run build:win
        working-directory: electron

      - name: Read upstream release metadata
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail

          release_json="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/tags/$RELEASE_TAG")"
          jq -r '.body // ""' <<< "$release_json" > release-notes.md
          echo "prerelease=$(jq -r '.prerelease' <<< "$release_json")" >> "$GITHUB_OUTPUT"

      - name: Publish Electron release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ matrix.tag }}
          name: ${{ matrix.tag }}
          body_path: release-notes.md
          prerelease: ${{ steps.release.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: electron/dist/*.exe
